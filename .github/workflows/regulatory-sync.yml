name: Automated Regulatory Delta Sync

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual on-demand execution via GitHub Actions dashboard

jobs:
  delta-sync:
    name: Sync Regulatory Updates (RBI, SEBI, MCA, GST, FEMA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 loguru python-dotenv

      - name: Run Incremental Regulatory Delta Sync
        run: |
          python -m pipeline.auto_sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit Updated Sync Ledger
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Regulatory Sync Bot"
          git add data/sync_ledger.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(sync): automated regulatory ledger update [skip ci]"
          git push
        continue-on-error: true
